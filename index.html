r:#e3efea}.topright{display:flex;align-items:center;gap:12px}.pill{border:1px solid #36543f;border-radius:50px;color:var(--accent);padding:7px 12px;font-size:11px;font-weight:700;white-space:nowrap}.avatar{background:#344836;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:11px;font-weight:800}.wrap{max-width:1480px;padding:38px 39px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:800;margin-bottom:12px}.sub{margin:10px 0 0;font-size:13px}.btn{background:var(--accent);border:1px solid var(--accent);border-radius:10px;color:#18301e;font-weight:800;padding:12px 17px;white-space:nowrap}.btn:hover{filter:brightness(.92)}.btn.alt{color:var(--white);background:var(--panel2);border-color:var(--line)}.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}.hero{border:1px solid #3b5244;border-radius:18px;padding:25px 29px;background:radial-gradient(ellipse at 90% 10%,#30523d 0,transparent 48%),linear-gradient(105deg,#19382d,#132128);display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.hero h2{font-size:22px;letter-spacing:-.6px}.hero p{max-width:510px;font-size:13px;margin:8px 0 0;color:#acc7b5}.demo{background:#243b31;border:1px solid #4b7452;border-radius:8px;padding:9px 12px;font-size:11px;color:#cdf2b8;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.metric,.panel{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:22px}.metric .mtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.metric .glyph{border-radius:9px;background:#26392d;color:var(--accent);padding:8px}.number{font-size:clamp(21px,2.2vw,30px);font-weight:800;letter-spacing:-1.2px;margin:17px 0 8px}.delta{font-size:11px;color:var(--mint)}.split{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}.minor{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;text-align:left;min-width:540px}th{text-transform:uppercase;letter-spacing:1px;font-size:10px;color:#728892;font-weight:700;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:16px 10px;border-bottom:1px solid #23313a;color:#d4e2df;font-size:12px}tr:last-child td{border-bottom:0}.table{overflow:auto}.strong{font-weight:800;color:var(--white)}.muted{color:var(--muted)}.tag{display:inline-block;border-radius:7px;background:#213e32;color:var(--mint);padding:6px 9px;font-size:10px;font-weight:800}.tag.amber{background:#3c3227;color:var(--amber)}.bar{height:9px;border-radius:20px;background:#2e4046;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#90d4a0,var(--accent));border-radius:20px}.bars{display:grid;gap:19px}.barlabel{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px}.activity{display:grid;gap:13px}.act{display:flex;gap:12px;align-items:flex-start;font-size:12px}.dot{height:10px;width:10px;border-radius:50%;background:var(--mint);margin-top:5px;flex-shrink:0;box-shadow:0 0 0 4px #6fd9bd17}.act small{display:block;color:var(--muted);margin-top:6px}.actionlink{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer}.stack{display:grid;gap:19px}.empty{padding:30px;color:var(--muted);text-align:center}.modalback{position:fixed;inset:0;background:#050b0dd9;z-index:5;display:grid;place-items:center;padding:14px;backdrop-filter:blur(6px)}.modal{background:#17232b;border:1px solid #42545b;border-radius:18px;padding:24px;width:min(670px,100%);max-height:90dvh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.close{background:#28363b;border:0;border-radius:8px;color:white;padding:6px 11px;font-size:20px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px;font-size:12px;color:#acc1bf;font-weight:700}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;border:1px solid #40525b;background:#101a20;border-radius:9px;color:white;padding:12px;outline:none;min-width:0}.field textarea{min-height:80px}.field input:focus,.field select:focus{border-color:var(--accent)}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.baggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.note{font-size:12px;color:var(--muted);line-height:1.6}.insight{padding:16px 18px;background:#1b2d2b;border:1px solid #355046;border-radius:12px}.mobilebrand{display:none}@media(max-width:1100px){.sidebar{width:210px}.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.wrap{padding:28px}.top{padding:0 28px}}@media(max-width:700px){.layout{display:block;padding-bottom:75px}.sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:69px;z-index:4;display:block;padding:6px 3px;border-top:1px solid var(--line);border-right:0;background:#101b20}.sidebar .brand,.slabel,.sidefoot{display:none}.nav{display:flex;justify-content:space-between;gap:0;height:100%}.nav button{flex:1;min-width:0;padding:7px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:9px;font-size:9px}.nav button span{font-size:18px}.mobilebrand{display:block;color:var(--white);font-family:Manrope;font-weight:800}.top{height:64px;padding:0 17px}.crumb{display:none}.topright{gap:7px}.wrap{padding:22px 15px}.head{align-items:flex-start;gap:8px}.head h1{font-size:26px}.head .btn{padding:10px;font-size:11px}.hero{padding:21px;display:block}.hero h2{font-size:19px}.hero .demo{margin-top:14px;display:inline-block}.metrics{gap:10px}.metric,.panel{padding:15px}.metric .mtop{font-size:11px}.metric .glyph{display:none}.number{font-size:23px;margin:12px 0 5px}.fields{grid-template-columns:1fr}.baggrid{grid-template-columns:repeat(2,1fr)}.modal{padding:18px}.split{gap:12px}}
@media(max-width:700px){.nav button{font-size:8px}.nav{overflow-x:auto}.nav button{min-width:43px}} </style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">◈</div><div>GrainTrace<div class="subbrand">WAREHOUSE OS</div></div></div><div><div class="slabel">Workspace</div><nav id="nav" class="nav"></nav></div><div class="sidefoot"><strong>◉ DEMO ENVIRONMENT</strong><br>Explore supplier-to-dispatch traceability. All records are stored in this browser.</div></aside><div class="main"><header class="top"><div class="crumb">Workspace &nbsp; / &nbsp; <b id="crumb">Overview</b></div><div class="mobilebrand">◈ GrainTrace</div><div class="topright"><span class="pill">● LIVE DEMO</span><div class="avatar">GT</div></div></header><main id="app" class="wrap"></main></div></div><div id="overlay"></div><script>
'use strict';const KEY='graintrace-polished-v1',names=['Overview','Suppliers','Receiving','Processing','Inventory','Dispatch','Invoices','Reports'],icons=['◫','♙','⇣','⚖','▤','↗','▧','▥'];let view='Overview',state;const $=s=>document.querySelector(s),N=x=>Number(x||0),sum=a=>a.reduce((x,y)=>x+N(y),0),kg=x=>N(x).toLocaleString('en-GB',{maximumFractionDigits:2})+' kg',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\u0027':'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10),id=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5),date=x=>{let d=new Date(x);return Number.isNaN(d.getTime())?x:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};const demo=()=>{let ss=[['SUP-001','Adeyemi Agro Ventures','0803 555 1820','Ibadan, Oyo'],['SUP-002','Greenfield Rice Traders','0806 220 4739','Abeokuta, Ogun'],['SUP-003','Northfield Grains Ltd','0812 703 4050','Ilorin, Kwara'],['SUP-004','Harvest Point Farms','0703 820 1134','Osogbo, Osun']].map(x=>({id:x[0],name:x[1],phone:x[2],location:x[3],docs:[]}));let spec=[['DEL-2601','SUP-001','Paddy rice','2026-10-17',[51.4,50.8,52.1,49.7,50.6],[49.8,49.1,50.4,48.2,49.2] ],['DEL-2602','SUP-002','Paddy rice','2026-10-18',[51.7,50.9,49.8,51.2],[50.1,49.5,48.6,49.7]],['DEL-2603','SUP-003','Brown rice','2026-10-19',[49.9,50.2,48.8],[49.1,49.4,48.0]],['DEL-2604','SUP-004','Paddy rice','2026-10-20',[50.3,51.8,49.6,50.7],[null,null,null,null]]];let ds=spec.map(a=>({id:a[0],supplierId:a[1],product:a[2],date:a[3],bags:a[4].map((v,i)=>({id:a[0]+'-B'+String(i+1).padStart(3,'0'),before:v,after:a[5][i],remaining:a[5][i]??0}))}));ds[0].bags[0].remaining=29.8;ds[1].bags[0].remaining=30.1;return{demo:true,suppliers:ss,deliveries:ds,dispatches:[{id:'DSP-001',recipient:'Lagos Food Processors',date:'2026-10-20',lines:[{bagId:'DEL-2601-B001',weight:20}]},{id:'DSP-002',recipient:'Royal Mills',date:'2026-10-21',lines:[{bagId:'DEL-2602-B001',weight:20}]}],events:[{kind:'Dispatch',text:'20 kg shipped to Royal Mills',at:'2026-10-21'},{kind:'Receiving',text:'4 bags arrived from Harvest Point Farms',at:'2026-10-20'},{kind:'Processing',text:'Brown rice batch cleaned and weighed',at:'2026-10-19'}]}};try{state=JSON.parse(localStorage.getItem(KEY))||demo()}catch{state=demo()}state.invoices=state.invoices||[];state.suppliers.forEach(s=>s.docs=s.docs||[]);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(err){alert('Browser storage is full. Remove large attachments or export a backup.');return}render()}function bags(){return state.deliveries.flatMap(d=>d.bags.map(b=>({...b,supplierId:d.supplierId,product:d.product,deliveryId:d.id,date:d.date})))}function supplier(x){return state.suppliers.find(s=>s.id===x)?.name||'Unknown'}function event(k,t){state.events.unshift({kind:k,text:t,at:today()})}function btn(t,fn,kind=''){return '<button class="btn '+kind+'" onclick="'+fn+'">'+t+'</button>'}function show(v){view=v;render()}function tbl(h,r){return '<div class="table"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(r.join('')||'<tr><td colspan="'+h.length+'" class="empty">Nothing here yet</td></tr>')+'</tbody></table></div>'}function heading(t,description,action=''){return '<div class="head"><div><div class="eyebrow">Grain operations / '+esc(view)+'</div><h1>'+t+'</h1><p class="sub">'+description+'</p></div>'+action+'</div>'}function stat(t,v,n,ic){return '<div class="metric"><div class="mtop"><span>'+t+'</span><span class="glyph">'+ic+'</span></div><div class="number">'+v+'</div><div class="delta">'+n+'</div></div>'}function rows(ds){return ds.map(d=>'<tr><td class="strong">'+esc(d.id)+'</td><td>'+esc(supplier(d.supplierId))+'</td><td>'+esc(d.product)+'</td><td>'+d.bags.length+' bags</td><td>'+kg(sum(d.bags.map(b=>b.before)))+'</td><td><span class="tag '+(d.bags.every(b=>b.after!==null)?'':'amber')+'">'+(d.bags.every(b=>b.after!==null)?'Processed':'Pending')+'</span></td></tr>')}function render(){let all=bags(),ready=all.filter(b=>b.after!==null),gross=sum(all.map(b=>b.before)),stock=sum(all.map(b=>b.remaining)),cleaned=sum(ready.map(b=>b.after)),loss=sum(ready.map(b=>b.before-b.after));$('#nav').innerHTML=names.map((n,i)=>'<button class="'+(n===view?'active':'')+'" onclick="show(\''+n+'\')"><span>'+icons[i]+'</span>'+n+'</button>').join('');$('#crumb').textContent=view;let content='';if(view==='Overview'){let bySupplier=state.suppliers.map(s=>({name:s.name,w:sum(all.filter(b=>b.supplierId===s.id).map(b=>b.remaining))})).sort((a,b)=>b.w-a.w);content=heading('Good morning, operator.','Here is what is happening across your warehouse today.',btn('＋ Receive stock','openReceive()'))+'<div class="hero"><div><div class="eyebrow">END-TO-END VISIBILITY</div><h2>Know every bag. Track every kilogram.</h2><p>From supplier delivery and cleaning loss to final dispatch — your entire grain operation in one connected view.</p></div><span class="demo">● SAMPLE DATA LOADED</span></div><div class="metrics">'+stat('Available stock',kg(stock),'Across '+ready.length+' processed bags','▤')+stat('Total received',kg(gross),all.length+' bags logged','⇣')+stat('Cleaning loss',kg(loss),gross?((loss/gross)*100).toFixed(1)+'% of total received':'No data','◌')+stat('Active suppliers',state.suppliers.length,state.deliveries.length+' deliveries','♙')+'</div><div class="split"><div class="panel"><div class="panelhead"><h2>Recent deliveries</h2><button class="actionlink" onclick="show(\'Receiving\')">View all →</button></div>'+tbl(['Batch','Supplier','Product','Quantity','Gross','Status'],rows(state.deliveries.slice().reverse().slice(0,5)))+'</div><div class="stack"><div class="panel"><div class="panelhead"><h2>Stock by supplier</h2><span class="minor">Available kg</span></div><div class="bars">'+bySupplier.map(s=>'<div><div class="barlabel"><span>'+esc(s.name)+'</span><b>'+kg(s.w)+'</b></div><div class="bar"><i style="width:'+Math.round(s.w/(stock||1)*100)+'%"></i></div></div>').join('')+'</div></div><div class="panel"><div class="panelhead"><h2>Latest activity</h2><span class="minor">Live log</span></div><div class="activity">'+state.events.slice(0,4).map(e=>'<div class="act"><div class="dot"></div><div><b>'+esc(e.kind)+'</b><div class="muted">'+esc(e.text)+'</div><small>'+date(e.at)+'</small></div></div>').join('')+'</div></div></div></div>'}if(view==='Suppliers')content=heading('Supplier directory','Manage sources, contacts and delivery history.',btn('＋ Add supplier','openSupplier()'))+'<div class="panel">'+tbl(['Supplier','Contact','Location','Deliveries','Gross received','Documents','Map'],state.suppliers.map(s=>'<tr><td class="strong">'+esc(s.name)+'</td><td>'+esc(s.phone)+'</td><td>'+esc(s.location)+'</td><td>'+state.deliveries.filter(d=>d.supplierId===s.id).length+'</td><td>'+kg(sum(state.deliveries.filter(d=>d.supplierId===s.id).flatMap(d=>d.bags.map(b=>b.before))))+'</td><td><button class="actionlink" onclick="openDocs(\''+esc(s.id)+'\')">Files ('+(s.docs||[]).length+') →</button></td><td><button class="actionlink" onclick="openLocation(\''+esc(s.id)+'\')">Location ↗</button></td></tr>'))+'</div>';if(view==='Receiving')content=heading('Goods receiving','Capture arrivals and weigh bags individually.',btn('＋ New delivery','openReceive()'))+'<div class="panel">'+tbl(['Batch','Supplier','Product','Bags','Gross weight','Status'],rows(state.deliveries.slice().reverse()))+'</div>';if(view==='Processing')content=heading('Processing centre','Log cleaned weights and monitor losses.',btn('＋ Process bag','openProcess()'))+'<div class="metrics">'+stat('Awaiting cleaning',all.filter(b=>b.after===null).length+' bags','Unprocessed inventory','◌')+stat('Clean weight',kg(cleaned),'Ready stock before dispatch','▤')+stat('Material removed',kg(loss),'Difference after cleaning','⚖')+stat('Yield rate',gross?((cleaned/sum(ready.map(b=>b.before)))*100).toFixed(1)+'%':'0%','Processed bags only','↗')+'</div><div class="panel">'+tbl(['Bag reference','Supplier','Original','Cleaned','Loss','Status'],all.map(b=>'<tr><td class="strong">'+esc(b.id)+'</td><td>'+esc(supplier(b.supplierId))+'</td><td>'+kg(b.before)+'</td><td>'+(b.after===null?'—':kg(b.after))+'</td><td>'+(b.after===null?'—':kg(b.before-b.after))+'</td><td><span class="tag '+(b.after===null?'amber':'')+'">'+(b.after===null?'Pending':'Complete')+'</span></td></tr>'))+'</div>';if(view==='Inventory')content=heading('Warehouse inventory','Bag-level availability with full supplier traceability.',btn('＋ Dispatch','openDispatch()'))+'<div class="metrics">'+stat('Ready for dispatch',kg(stock),'Available cleaned stock','▤')+stat('Total bags',all.length,'Registered in warehouse','◫')+stat('Unprocessed',all.filter(b=>b.after===null).length,'Awaiting clean weight','◌')+stat('Dispatched',kg(sum(state.dispatches.flatMap(d=>d.lines.map(l=>l.weight)))),'Historical goods out','↗')+'</div><div class="panel">'+tbl(['Bag reference','Supplier','Product','Gross','Clean','Balance'],all.map(b=>'<tr><td class="strong">'+esc(b.id)+'</td><td>'+esc(supplier(b.supplierId))+'</td><td>'+esc(b.product)+'</td><td>'+kg(b.before)+'</td><td>'+(b.after===null?'—':kg(b.after))+'</td><td><span class="tag '+(b.after===null?'amber':'')+'">'+(b.after===null?'Pending':kg(b.remaining))+'</span></td></tr>'))+'</div>';if(view==='Dispatch')content=heading('Dispatch management','Know exactly what left, when and for whom.',btn('＋ New dispatch','openDispatch()'))+'<div class="panel">'+tbl(['Dispatch','Date','Recipient','Bag reference','Quantity'],state.dispatches.slice().reverse().flatMap(d=>d.lines.map(l=>'<tr><td class="strong">'+esc(d.id)+'</td><td>'+date(d.date)+'</td><td>'+esc(d.recipient)+'</td><td>'+esc(l.bagId)+'</td><td>'+kg(l.weight)+'</td></tr>')) )+'</div>';if(view==='Invoices')content=heading('Invoices & billing','Create professional invoices and open email drafts with invoice details.',btn('＋ Create invoice','openInvoice()'))+'<div class="panel"><div class="panelhead"><h2>Issued invoices</h2><span class="minor">'+state.invoices.length+' records</span></div>'+tbl(['Invoice','Customer','Email','Issued','Amount','Actions'],state.invoices.slice().reverse().map(i=>'<tr><td class="strong">'+esc(i.number)+'</td><td>'+esc(i.customer)+'</td><td>'+esc(i.email)+'</td><td>'+esc(i.issued)+'</td><td>'+money(i.qty*i.rate)+'</td><td><button class="actionlink" onclick="previewInvoice(\''+esc(i.id)+'\')">View / print →</button></td></tr>'))+'</div>';if(view==='Reports')content=heading('Reports & exports','Make smarter purchasing and warehouse decisions.')+'<div class="metrics">'+stat('Gross received',kg(gross),'All deliveries','⇣')+stat('Net processed',kg(cleaned),'After removing dirt','⚖')+stat('Loss',kg(loss),'Processing waste','◌')+stat('Current stock',kg(stock),'Unshipped cleaned weight','▤')+'</div><div class="panel"><div class="panelhead"><h2>Export your reports</h2></div><p>Save bag-level stock details in CSV, or download a complete JSON backup of this browser workspace.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">'+btn('↓ Download stock CSV','exportCSV()')+btn('↓ Export JSON','exportJSON()','alt')+'</div><p class="note">Demo data is illustrative, not from a real business. Data remains on this browser unless exported.</p></div><div class="panel" style="margin-top:16px"><h2>Workspace controls</h2><p>Want to start afresh? Restore the original sample suppliers and records.</p>'+btn('↺ Reset demo','resetDemo()','alt')+'</div>';$('#app').innerHTML=content}
function modal(title,body){$('#overlay').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>'+title+'</h2><button class="close" onclick="closeModal()">×</button></div>'+body+'</div></div>'}function closeModal(){$('#overlay').innerHTML=''}function field(label,name,type='text',value=''){return '<label class="field">'+label+'<input type="'+type+'" name="'+name+'" value="'+esc(value)+'" '+(type==='number'?'min="0" step="any"':'')+' required></label>'}function select(label,name,options){return '<label class="field">'+label+'<select name="'+name+'">'+options.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select></label>'}function formdata(e){e.preventDefault();return Object.fromEntries(new FormData(e.target))}function openSupplier(){modal('New supplier','<form onsubmit="addSupplier(event)"><div class="fields">'+field('Supplier name','name')+field('Phone','phone')+field('Location','location')+'</div><p class="note">After saving, use the Location button to record a map pin or capture GPS with permission.</p><div class="modalactions"><button class="btn">Save supplier</button></div></form>')}function addSupplier(e){let d=formdata(e);state.suppliers.push({...d,id:id('SUP'),docs:[]});event('Supplier','Created supplier '+d.name);closeModal();view='Suppliers';save()}function openReceive(){modal('Receive a delivery','<form onsubmit="receiveStep(event)"><div class="fields">'+select('Supplier','supplierId',state.suppliers.map(s=>[s.id,s.name]))+field('Product','product','text','Paddy rice')+field('Delivery date','date','date',today())+field('Number of bags (max 100)','count','number','5')+'</div><div class="modalactions"><button class="btn">Continue →</button></div></form>')}let pending;function receiveStep(e){pending=formdata(e);let n=N(pending.count);if(!Number.isInteger(n)||n<1||n>100)return alert('Please choose 1–100 bags');modal('Weigh each bag','<p class="note">Each bag receives a unique reference. Enter the original weight in kilograms.</p><form onsubmit="finishReceive(event)"><div class="baggrid">'+Array.from({length:n},(_,i)=>field('Bag '+(i+1),'b'+i,'number','50')).join('')+'</div><div class="modalactions"><button class="btn">Record '+n+' bags</button></div></form>')}function finishReceive(e){let d=formdata(e),did=id('DEL');let bs=Array.from({length:N(pending.count)},(_,i)=>({id:did+'-B'+String(i+1).padStart(3,'0'),before:N(d['b'+i]),after:null,remaining:0}));if(bs.some(b=>b.before<=0))return alert('All bags need positive weight');state.deliveries.push({id:did,supplierId:pending.supplierId,product:pending.product,date:pending.date,bags:bs});event('Receiving',bs.length+' bags from '+supplier(pending.supplierId));closeModal();view='Receiving';save()}function openProcess(){let bs=bags().filter(b=>b.after===null);if(!bs.length)return alert('No bags awaiting processing');modal('Clean & reweigh','<p class="note">Choose a bag and record its weight after cleaning.</p><form onsubmit="finishProcess(event)"><div class="fields">'+select('Select bag','bagId',bs.map(b=>[b.id,b.id+' · '+kg(b.before)]))+field('Cleaned weight (kg)','after','number','49')+'</div><div class="modalactions"><button class="btn">Save clean weight</button></div></form>')}function finishProcess(e){let d=formdata(e),b=state.deliveries.flatMap(d=>d.bags).find(x=>x.id===d.bagId),a=N(d.after);if(!b||a<0||a>b.before)return alert('Clean weight cannot exceed original');b.after=a;b.remaining=a;event('Processing',b.id+' processed · '+kg(a));closeModal();save()}function openDispatch(){let bs=bags().filter(b=>b.remaining>0);if(!bs.length)return alert('No stock is ready');modal('Dispatch stock','<form onsubmit="finishDispatch(event)"><div class="fields">'+field('Recipient / buyer','recipient')+field('Dispatch date','date','date',today())+select('Bag to draw stock from','bagId',bs.map(b=>[b.id,b.id+' · '+kg(b.remaining)]))+field('Weight (kg)','weight','number','10')+'</div><div class="modalactions"><button class="btn">Confirm dispatch</button></div></form>')}function finishDispatch(e){let d=formdata(e),b=state.deliveries.flatMap(d=>d.bags).find(x=>x.id===d.bagId),w=N(d.weight);if(!b||w<=0||w>b.remaining)return alert('Quantity exceeds stock');b.remaining=+(b.remaining-w).toFixed(3);state.dispatches.push({id:id('DSP'),recipient:d.recipient,date:d.date,lines:[{bagId:b.id,weight:w}]});event('Dispatch',kg(w)+' delivered to '+d.recipient);closeModal();view='Dispatch';save()}function dl(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){dl('graintrace-demo.json',JSON.stringify(state,null,2),'application/json')}function exportCSV(){dl('graintrace-stock.csv','Bag,Supplier,Product,Gross kg,Clean kg,Available kg\n'+bags().map(b=>[b.id,supplier(b.supplierId),b.product,b.before,b.after??'',b.remaining].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}function resetDemo(){if(confirm('Restore sample data and discard edits saved in this browser?')){state=demo();save()}}

function validCoords(lat,lng){return Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180}
function geoLink(s,mode){let q=validCoords(Number(s.latitude),Number(s.longitude))&&s.latitude!==undefined&&s.longitude!==undefined?Number(s.latitude)+','+Number(s.longitude):s.location;if(!q)return '';return 'https://www.google.com/maps/'+(mode==='dir'?'dir/?api=1&destination=':'search/?api=1&query=')+encodeURIComponent(q)}
function openLocation(sid){let s=state.suppliers.find(x=>x.id===sid);if(!s)return;let coords=s.latitude!==undefined&&s.longitude!==undefined&&validCoords(Number(s.latitude),Number(s.longitude));modal('Supplier location — '+esc(s.name),'<p class="note">Location is captured only when someone taps the GPS button and grants browser permission. You can also enter coordinates from a supplier-shared map pin. This does not provide real-time tracking.</p><form onsubmit="saveLocation(event,\''+esc(sid)+'\')"><div class="fields">'+field('Address / location','location','text',s.location||'')+'<label class="field">Latitude<input name="latitude" type="number" step="any" min="-90" max="90" value="'+(coords?esc(s.latitude):'')+'" placeholder="e.g. 7.3775"></label><label class="field">Longitude<input name="longitude" type="number" step="any" min="-180" max="180" value="'+(coords?esc(s.longitude):'')+'" placeholder="e.g. 3.9470"></label></div><div class="modalactions" style="flex-wrap:wrap">'+btn('⌾ Capture my GPS','captureSupplierGPS(\''+esc(sid)+'\')','alt')+btn('Save location','null') .replace('onclick="null"','type="submit"')+'</div></form><div class="modalactions" style="justify-content:flex-start;flex-wrap:wrap">'+(geoLink(s,'map')?'<a class="btn alt" target="_blank" rel="noopener noreferrer" href="'+geoLink(s,'map')+'">◉ View on map ↗</a><a class="btn alt" target="_blank" rel="noopener noreferrer" href="'+geoLink(s,'dir')+'">↗ Directions</a>':'')+'</div>'+(coords?'<p class="note">Saved pin: '+esc(s.latitude)+', '+esc(s.longitude)+'</p>':'<p class="note">No precise GPS pin saved yet. The map link searches the supplied address.</p>'))}
function saveLocation(e,sid){let d=formdata(e),s=state.suppliers.find(x=>x.id===sid);if(!s)return;let hasLat=d.latitude.trim()!=='',hasLng=d.longitude.trim()!=='';if(hasLat!==hasLng)return alert('Enter both latitude and longitude, or leave both blank.');let la=Number(d.latitude),lo=Number(d.longitude);if(hasLat&&!validCoords(la,lo))return alert('Coordinates are invalid.');s.location=d.location;if(hasLat){s.latitude=la;s.longitude=lo}else{delete s.latitude;delete s.longitude}event('Supplier','Updated location for '+s.name);save();openLocation(sid)}
function captureSupplierGPS(sid){if(!navigator.geolocation)return alert('GPS is not supported in this browser. Enter coordinates manually.');let s=state.suppliers.find(x=>x.id===sid);if(!s)return;if(!confirm('Capture this device’s current position as the saved location for '+s.name+'? Only do this while physically at the supplier location or with their permission.'))return;navigator.geolocation.getCurrentPosition(pos=>{let la=pos.coords.latitude,lo=pos.coords.longitude;if(!validCoords(la,lo))return alert('Invalid GPS position');s.latitude=+la.toFixed(7);s.longitude=+lo.toFixed(7);event('Supplier','Captured GPS coordinates for '+s.name);save();openLocation(sid)},err=>alert('Could not capture GPS: '+(err.code===1?'Permission denied.':err.message)+'. You can enter coordinates manually.'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function money(n){return '₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2})}
function openDocs(sid){let s=state.suppliers.find(x=>x.id===sid);if(!s)return;let files=s.docs||[];modal('Supplier documents — '+esc(s.name),'<p class="note">Attach supplier permits, delivery notes, certificates or agreements. Demo storage is local to this browser, so use only non-sensitive sample files (maximum 300 KB each).</p><div class="panel">'+(files.map(x=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #283740;padding:12px 0"><div><b>'+esc(x.label)+'</b><div class="minor">'+esc(x.name)+' · '+esc(x.date)+'</div></div><div><button class="actionlink" onclick="downloadDoc(\''+esc(sid)+'\',\''+esc(x.id)+'\')">Download</button> <button class="actionlink" onclick="deleteDoc(\''+esc(sid)+'\',\''+esc(x.id)+'\')">Remove</button></div></div>').join('')||'<p class="note">No documents attached yet.</p>')+'</div><form onsubmit="attachDoc(event,\''+esc(sid)+'\')"><div class="fields">'+field('Document label','label')+'<label class="field">Upload file (max 300 KB)<input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" required></label></div><div class="modalactions"><button class="btn">Save document</button></div></form>')}
function attachDoc(e,sid){e.preventDefault();let s=state.suppliers.find(x=>x.id===sid),input=e.target.querySelector('input[type=file]'),file=input.files[0],label=e.target.elements.label.value.trim();if(!s||!file||!label)return;if(file.size>300000)return alert('Maximum file size is 300 KB in this browser demo.');let extensions=['pdf','png','jpg','jpeg','doc','docx'];if(!extensions.includes((file.name.split('.').pop()||'').toLowerCase()))return alert('Please select a PDF, image or Word document.');let reader=new FileReader();reader.onload=()=>{s.docs.push({id:id('DOC'),name:file.name,label,date:today(),data:reader.result});save();openDocs(sid)};reader.readAsDataURL(file)}
function downloadDoc(sid,did){let file=state.suppliers.find(s=>s.id===sid)?.docs.find(d=>d.id===did);if(!file)return;let a=document.createElement('a');a.href=file.data;a.download=file.name;document.body.appendChild(a);a.click();a.remove()}
function deleteDoc(sid,did){if(!confirm('Remove this document?'))return;let s=state.suppliers.find(s=>s.id===sid);if(!s)return;s.docs=s.docs.filter(x=>x.id!==did);save();openDocs(sid)}
function openInvoice(){modal('Create a new invoice','<p class="note">Currency: Nigerian naira (₦). Each invoice can be printed or saved to PDF using your browser, then attached to an email draft.</p><form onsubmit="createInvoice(event)"><div class="fields">'+field('Customer / business name','customer')+field('Customer email','email','email')+field('Billing address','address')+field('Issue date','issued','date',today())+field('Due date','due','date',today())+field('Item description','item','text','Processed rice')+field('Quantity (kg)','qty','number','100')+field('Price per kg (₦)','rate','number','2500')+'<label class="field full">Notes<textarea name="notes" placeholder="Payment terms or bank details (optional)"></textarea></label></div><div class="modalactions"><button class="btn">Create invoice</button></div></form>')}
function createInvoice(e){let d=formdata(e);if(N(d.qty)<=0||N(d.rate)<0)return alert('Please enter valid quantity and price.');let i={...d,id:id('INV'),number:'GT-'+String(state.invoices.length+1).padStart(4,'0'),qty:N(d.qty),rate:N(d.rate)};state.invoices.push(i);event('Invoice','Issued '+i.number+' for '+i.customer);closeModal();view='Invoices';save();previewInvoice(i.id)}
function invoiceHtml(i){let rows='<tr><td>'+esc(i.item)+'</td><td>'+kg(i.qty)+'</td><td>'+money(i.rate)+'</td><td>'+money(i.qty*i.rate)+'</td></tr>';return '<div class="invoicepaper"><div class="invoicehead"><div><div class="invlogo">◈ GrainTrace</div><div style="font-size:12px;color:#657875">WAREHOUSE OPERATIONS</div></div><div style="text-align:right"><h1 style="color:#12362d;font-size:30px;letter-spacing:-1px">INVOICE</h1><b>'+esc(i.number)+'</b></div></div><div class="invrule"></div><div class="invoice-cols"><div><small>BILL TO</small><h3>'+esc(i.customer)+'</h3><div>'+esc(i.address)+'</div><div>'+esc(i.email)+'</div></div><div style="text-align:right"><small>ISSUED</small><div><b>'+esc(i.issued)+'</b></div><small style="margin-top:12px">DUE DATE</small><div><b>'+esc(i.due)+'</b></div></div></div><table class="invtable"><thead><tr><th>Description</th><th>Quantity</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>'+rows+'</tbody></table><div class="invtotal">TOTAL DUE <strong>'+money(i.qty*i.rate)+'</strong></div><div class="invnotes"><strong>Notes</strong><p>'+esc(i.notes||'Thank you for your business.')+'</p></div><footer class="invfoot">GrainTrace Warehouse Operations · Generated invoice</footer></div>'}
const invoiceCSS='.invoicepaper{background:white;color:#263d39;border-radius:10px;padding:38px;max-width:780px;margin:auto;font:14px Arial,sans-serif}.invoicehead,.invoice-cols{display:flex;justify-content:space-between;gap:20px}.invlogo{font-size:23px;font-weight:800;color:#1b6946}.invrule{height:3px;background:#b8ef83;margin:22px 0 30px}.invoice-cols{margin-bottom:44px;line-height:1.8}.invoice-cols small{color:#86948c;font-size:10px;font-weight:700;letter-spacing:2px;display:block}.invoice-cols h3{margin:4px 0}.invtable{width:100%;min-width:0;border-collapse:collapse}.invtable th{background:#edf4ef;color:#4f6860;text-align:left;padding:16px 12px;font-size:11px}.invtable td{color:#263d39;padding:19px 12px;border-bottom:1px solid #d9e4dc}.invtotal{display:flex;justify-content:flex-end;align-items:center;gap:25px;margin:28px 0;font-weight:800}.invtotal strong{font-size:25px;color:#175a3b}.invnotes{margin-top:55px;font-size:12px;color:#546b5f}.invfoot{border-top:1px solid #d9e4dc;text-align:center;margin-top:80px;padding-top:14px;color:#9caaa2;font-size:10px}';
function previewInvoice(id){let i=state.invoices.find(x=>x.id===id);if(!i)return;modal('Invoice '+esc(i.number),'<style>'+invoiceCSS+'</style><div style="max-height:55vh;overflow:auto">'+invoiceHtml(i)+'</div><div class="modalactions" style="flex-wrap:wrap">'+btn('✉ Email draft','emailInvoice(\''+esc(id)+'\')','alt')+btn('⎙ Print / save PDF','printInvoice(\''+esc(id)+'\')')+'</div><p class="note">Email opens your mail application with the invoice summary, not an attached PDF. Use Print → Save as PDF and attach the file manually. This prototype does not automatically send email.</p>')}
function printInvoice(id){let i=state.invoices.find(x=>x.id===id);if(!i)return;let w=window.open('','_blank');if(!w)return alert('Please allow pop-ups to print your invoice.');w.document.write('<!doctype html><html><head><title>Invoice '+esc(i.number)+'</title><style>'+invoiceCSS+'body{margin:0;padding:25px;background:#f6f8f6}@media print{body{padding:0;background:white}.invoicepaper{padding:12mm} @page{size:A4;margin:10mm}}</style></head><body>'+invoiceHtml(i)+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}
function emailInvoice(id){let i=state.invoices.find(x=>x.id===id);if(!i)return;let body='Hello '+i.customer+',\n\nPlease find the details for invoice '+i.number+'.\n\nItem: '+i.item+'\nQuantity: '+kg(i.qty)+'\nUnit price: '+money(i.rate)+'\nTotal: '+money(i.qty*i.rate)+'\nDue: '+i.due+'\n\nPlease see the attached PDF invoice (attach the PDF after using Print / Save PDF).\n\nKind regards,\nWarehouse Accounts';window.location.href='mailto:'+encodeURIComponent(i.email)+'?subject='+encodeURIComponent('Invoice '+i.number)+'&body='+encodeURIComponent(body)}
render();
</script><script src="pks-workflow.js?v=1"></script><script src="photo-evidence.js?v=3"></script></body></html>
